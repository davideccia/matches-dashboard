# ==============================================================================
# default.conf — server virtuale che serve la SPA statica.
# ==============================================================================

server {
    # Porta non privilegiata: il processo gira come utente `nginx` (uid 101).
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset           utf-8;
    absolute_redirect off;

    include /etc/nginx/security-headers.conf;

    # ── Health check ─────────────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Asset con nome hashato: immutabili, cache a vita ─────────────────────
    location /_nuxt/ {
        access_log off;
        include    /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files  $uri =404;
    }

    # ── Shell HTML: mai in cache ─────────────────────────────────────────────
    # Qui vive anche il payload di runtimeConfig (NUXT_PUBLIC_*), quindi una
    # copia in cache significherebbe SPA vecchia E config vecchia dopo un deploy.
    location ~ ^/(?:index|200|404)\.html$ {
        include    /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ── Asset statici dalla cartella public/ ─────────────────────────────────
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|avif|svg|woff2?|ttf|eot)$ {
        access_log off;
        include    /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files  $uri =404;
    }

    location = /site.webmanifest {
        include    /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /robots.txt {
        access_log off;
        include    /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # IL PEZZO CRITICO: `nuxt generate` emette un index.html per le rotte
    # statiche, ma nulla per quelle dinamiche (/admin/tournaments/42,
    # /admin/athletes/7/edit): senza questo rewrite andrebbero in 404 al refresh.
    #
    # `$uri/index.html` invece di `$uri/`: serve direttamente l'index della
    # directory, evitando il 301 verso lo slash finale.
    location / {
        include    /etc/nginx/security-headers.conf;
        # Tutto ciò che arriva qui è HTML (gli asset veri sono già stati
        # intercettati sopra): mai in cache.
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files  $uri $uri/index.html /index.html;
    }

    # File nascosti (.git, .env, …) mai serviti.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
