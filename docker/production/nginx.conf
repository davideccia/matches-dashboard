# ==============================================================================
# nginx.conf — contesto globale.
#
# Sostituisce la config di default dell'immagine ufficiale perché ogni path
# scrivibile deve stare sotto /tmp: è ciò che permette di girare come utente
# non-root (`nginx`, uid 101) con rootfs in sola lettura.
# ==============================================================================

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Path scrivibili sotto /tmp → consente USER nginx + read_only rootfs.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # Log su stdout/stderr: raccolti dal container runtime.
    access_log        /dev/stdout combined;

    server_tokens     off;
    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;

    # gzip_static serve i .gz pre-compressi in fase di build: zero CPU a runtime.
    gzip              on;
    gzip_static       on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json image/svg+xml
                      application/xml font/woff2;

    include /etc/nginx/conf.d/*.conf;
}
