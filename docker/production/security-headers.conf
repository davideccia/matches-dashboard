# ==============================================================================
# security-headers.conf — da INCLUDERE in ogni location che usa add_header.
#
# In nginx un `add_header` dentro una location ANNULLA tutti quelli ereditati dal
# server block. È il classico trabocchetto di add_header: senza questo include
# ripetuto, le pagine servite dal fallback SPA uscirebbero senza header di
# sicurezza (verificato: succedeva davvero).
# ==============================================================================

add_header X-Frame-Options           "DENY"                            always;
add_header X-Content-Type-Options    "nosniff"                         always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

# ── CSP: volutamente NON attiva di default ───────────────────────────────────
# L'app fa XHR verso l'API e apre WebSocket verso Reverb su host che cambiano per
# ambiente, e che l'utente può ripuntare a runtime con l'override localStorage
# (`matches.api-override`). Una CSP hardcoded romperebbe l'env switcher.
# Attivala per-ambiente compilando gli host reali:
#
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.matches.it wss://reverb.matches.it; frame-ancestors 'none'; base-uri 'self'" always;

# ── HSTS ─────────────────────────────────────────────────────────────────────
# Solo se il container è esposto direttamente in HTTPS. Se davanti c'è un reverse
# proxy o un ALB che termina il TLS, l'header va impostato lì, non qui.
#
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
