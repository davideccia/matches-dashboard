<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>matches-dashboard — architecture map</title>
<style>
  :root {
    --bg: #0b1017;
    --bg-panel: #111823;
    --bg-node: #172130;
    --line: #24313f;
    --line-strong: #34465a;
    --text: #dbe4ee;
    --text-dim: #8798aa;
    --text-faint: #63758a;
    --entry: #60a5fa;
    --domain: #a78bfa;
    --data: #34d399;
    --async: #fbbf24;
    --integration: #fb7185;
    --infra: #38bdf8;
    --flow: #fde047;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .01em; }
  header .meta { color: var(--text-faint); font-size: 12px; }
  header .legend { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--text-dim); }
  header .legend span { display: inline-flex; align-items: center; gap: 5px; }
  header .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  main {
    display: flex; align-items: stretch;
    height: calc(100vh - 50px); min-height: 0;
  }
  #diagram {
    position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden;
    touch-action: none; cursor: grab; background:
      radial-gradient(circle at 18% 12%, #131c28 0%, var(--bg) 55%);
  }
  #diagram.dragging { cursor: grabbing; }
  #canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  #edges, #overlay { position: absolute; top: 0; left: 0; overflow: visible; }
  #overlay { pointer-events: none; }
  #nodes { position: absolute; top: 0; left: 0; }

  .band-label {
    position: absolute; font-size: 12px; font-weight: 650; letter-spacing: .09em;
    text-transform: uppercase; color: var(--text-faint); white-space: nowrap;
  }
  .band-rule { position: absolute; height: 1px; background: var(--line); opacity: .8; }

  .node {
    position: absolute; padding: 7px 9px; border-radius: 8px;
    background: var(--bg-node); border: 1px solid var(--line-strong);
    border-left-width: 3px; cursor: pointer; overflow: hidden;
    transition: opacity .16s, box-shadow .16s, border-color .16s;
  }
  .node .nl {
    font-size: 12.5px; font-weight: 600; line-height: 1.25; color: var(--text);
    overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .node .nt { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; letter-spacing: .02em; }
  .node:hover, .node.focus { box-shadow: 0 0 0 1px var(--line-strong), 0 6px 18px #0008; }
  .node.dim { opacity: .16; }
  .node.on { opacity: 1; box-shadow: 0 0 0 2px var(--flow), 0 6px 20px #0009; }
  .node.orphan { border-style: dashed; }

  .edge { fill: none; stroke: var(--line-strong); stroke-width: 1.1; opacity: .55; }
  .edge.dim { opacity: .07; }
  .edge.on { stroke: var(--flow); stroke-width: 2; opacity: .95; }
  .edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: help; }
  .flow-path { fill: none; stroke: var(--flow); stroke-width: 2.4; stroke-dasharray: 7 6; opacity: .85; }
  .badge {
    position: absolute; width: 20px; height: 20px; border-radius: 50%;
    background: var(--flow); color: #191400; font-size: 11.5px; font-weight: 750;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px #000a;
  }

  #panel {
    flex: 0 0 340px; max-width: 340px; border-left: 1px solid var(--line);
    background: var(--bg-panel); overflow-y: auto; padding: 14px 14px 28px;
  }
  #panel h2 { margin: 0 0 4px; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--text-faint); }
  #panel .hint { font-size: 11.5px; color: var(--text-faint); margin: 0 0 12px; }
  .flow {
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; margin-bottom: 8px;
    cursor: pointer; background: #131b26; transition: border-color .15s, background .15s;
  }
  .flow:hover { border-color: var(--line-strong); }
  .flow.active { border-color: var(--flow); background: #1a1c14; }
  .flow .fn { font-size: 13px; font-weight: 650; }
  .flow .fd { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; }
  .steps { list-style: none; margin: 8px 0 2px; padding: 0; }
  .steps li {
    display: flex; gap: 8px; align-items: flex-start; padding: 4px 6px; border-radius: 6px;
    font-size: 12px; cursor: pointer;
  }
  .steps li:hover { background: #202a1a; }
  .steps .n {
    flex: 0 0 18px; height: 18px; border-radius: 50%; background: var(--flow); color: #191400;
    font-size: 10.5px; font-weight: 750; display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .steps .sp { color: var(--text-faint); font-size: 10.5px; overflow-wrap: anywhere; }
  .clear {
    width: 100%; margin: 2px 0 14px; padding: 6px; border-radius: 7px; cursor: pointer;
    background: transparent; border: 1px dashed var(--line-strong); color: var(--text-dim); font: inherit; font-size: 12px;
  }
  .clear:hover { color: var(--text); border-color: var(--flow); }
  .controls { display: flex; gap: 6px; margin-bottom: 12px; }
  .controls button {
    flex: 1; padding: 5px; border-radius: 7px; cursor: pointer; font: inherit; font-size: 12px;
    background: #16202c; border: 1px solid var(--line-strong); color: var(--text-dim);
  }
  .controls button:hover { color: var(--text); }

  #tooltip {
    position: fixed; z-index: 50; max-width: 320px; pointer-events: none; opacity: 0;
    transition: opacity .12s; padding: 9px 11px; border-radius: 9px;
    background: #0d141d; border: 1px solid var(--line-strong); box-shadow: 0 10px 30px #000b;
  }
  #tooltip.show { opacity: 1; }
  #tooltip .tl { font-size: 13px; font-weight: 650; }
  #tooltip .tm { font-size: 11px; color: var(--text-faint); margin: 2px 0 5px; overflow-wrap: anywhere; }
  #tooltip .td { font-size: 12px; color: var(--text-dim); }

  @media (max-width: 900px) {
    main { flex-direction: column; height: auto; }
    #diagram { height: 62vh; flex: none; }
    #panel { flex: none; max-width: none; width: 100%; border-left: 0; border-top: 1px solid var(--line); }
    header .legend { width: 100%; margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>matches-dashboard — architecture map</h1>
  <span class="meta" id="counts"></span>
  <div class="legend" id="legend"></div>
</header>

<main>
  <section id="diagram">
    <div id="canvas">
      <svg id="edges"></svg>
      <div id="nodes"></div>
      <svg id="overlay"></svg>
    </div>
  </section>
  <aside id="panel">
    <div class="controls">
      <button id="btn-fit">Fit</button>
      <button id="btn-zin">Zoom +</button>
      <button id="btn-zout">Zoom −</button>
    </div>
    <h2>Flows</h2>
    <p class="hint">Select a flow to trace the path work actually takes; click a step to centre its node. Hover any node for its file and role.</p>
    <div id="flows"></div>
  </aside>
</main>

<div id="tooltip"></div>

ryFormPanel","type":"service","layer":"domain","path":"app/components/panels/WeightCategoryFormPanel.vue","description":"Slideover create/edit form for weight categories."},{"id":"panel-experience-tier","label":"ExperienceTierFormPanel","type":"service","layer":"domain","path":"app/components/panels/ExperienceTierFormPanel.vue","description":"Slideover create/edit form for experience tiers, posting to the tournament-scoped endpoint when a tournamentId prop is given."},{"id":"panel-user","label":"UserFormPanel","type":"service","layer":"domain","path":"app/components/panels/UserFormPanel.vue","description":"Slideover create/edit form for admin users and their credentials."},{"id":"panel-tournament","label":"TournamentFormPanel","type":"service","layer":"domain","path":"app/components/panels/TournamentFormPanel.vue","description":"Slideover create/edit form for tournaments: name, venue, date and status."},{"id":"panel-registration","label":"RegistrationFormPanel","type":"service","layer":"domain","path":"app/components/panels/RegistrationFormPanel.vue","description":"Slideover form enrolling an athlete in a tournament with discipline and weight category, plus payment, arrival and weigh-in fields."},{"id":"panel-match-record","label":"MatchRecordFormPanel","type":"service","layer":"domain","path":"app/components/panels/MatchRecordFormPanel.vue","description":"The largest form in the app: bout composition, corner athletes filtered by tournament/discipline/category/gender, outcome, and the judges' points grid kept in sync with the round count."},{"id":"tab-registry","label":"Registry tab","type":"service","layer":"domain","path":"app/components/tournaments/TournamentsRegistryTab.vue","description":"Edits the tournament's own fields and manages its tournament-scoped experience tiers in a nested table."},{"id":"tab-registrations","label":"Registrations tab","type":"service","layer":"domain","path":"app/components/tournaments/TournamentsRegistrationsTab.vue","description":" mponents/ApiEnvironmentSwitcher.vue","description":"Zod-validated form over base URL and all four Reverb values that writes a per-browser override and can reset back to the build defaults."},{"id":"locale-switcher","label":"LocaleSwitcher","type":"service","layer":"domain","path":"app/components/LocaleSwitcher.vue","description":"Small it/en toggle used on the pages that render without the admin layout."},{"id":"color-mode-switcher","label":"ColorModeSwitcher","type":"service","layer":"domain","path":"app/components/ColorModeSwitcher.vue","description":"Orphan: a palette popover plus light/dark button that no page or layout references — the Settings page reimplements the same controls inline."},{"id":"use-api","label":"useApi","type":"service","layer":"data","path":"app/composables/useApi.ts","description":"Wraps the Sanctum client with the active locale as Accept-Language and exposes get/post/put/del/upload/download for every admin call."},{"id":"api-download","label":"useApi().download","type":"service","layer":"data","path":"app/composables/useApi.ts","description":"PDF escape hatch that bypasses the Sanctum client: plain $fetch with a blob response, the resolved base URL and the token read straight from the cookie."},{"id":"api-upload","label":"useApi().upload","type":"service","layer":"data","path":"app/composables/useApi.ts","description":"Orphan: a multipart FormData POST helper that is exported but called from nowhere in the app."},{"id":"api-error-message","label":"getApiErrorMessage","type":"service","layer":"data","path":"app/composables/useApi.ts","description":"Pulls the backend's message out of an unknown error object and is what every catch block feeds to a toast."},{"id":"use-auth","label":"useAuth","type":"service","layer":"data","path":"app/composables/useAuth.ts","description":"Wraps useSanctumAuth and unwraps the API's { data } envelope to expose user, isAuthenticated, login, logout and fetchUser."},{"id":"use-user","label":"useUser","type":"service","layer":"data","path":"app/composables/useUser.ts","description":"Exposes the current user plus a clear() that calls refreshNuxtData, invalidating every cached payload on login and logout."},{"id":"use-api-config","label":"useApiConfig","type":"service","layer":"data","path":"app/composables/useApiConfig.ts","description":"Resolves base URL and Reverb settings with localStorage override winning over build-time env vars winning over API_ENDPOINTS[0], and reloads the page when an override is applied."},{"id":"use-color-preference","label":"useColorPreference","type":"service","layer":"data","path":"app/composables/useColorPreference.ts","description":"Sets the runtime primary/secondary @nuxt/ui colours and persists the choice to a long-lived cookie."},{"id":"public-fetch-helpers","label":"Public $fetch helpers","type":"service","layer":"data","path":"app/pages/public/athletes/registration.vue, app/pages/public/tournaments/match_records.vue","description":"Per-page apiGet/apiPost wrappers that skip the Sanctum client entirely, reading only the resolved base URL so no token is ever attached."},{"id":"types-models","label":"Domain model types","type":"model","layer":"data","path":"app/types/models.ts","description":"TypeScript mirrors of the API resources (Athlete, Tournament, Registration, MatchRecord, User, …) where relations are optional because they appear only with ?with=."},{"id":"constants-enums","label":"Enums & constants","type":"model","layer":"data","path":"app/utils/constants.ts","description":"The backend's enum vocabularies as const arrays plus page sizes, the API endpoint list and the colour palette."},{"id":"utils-date","label":"Date helpers","type":"service","layer":"data","path":"app/utils/date.ts","description":"dayjs conversions between API ISO strings, HTML date inputs and locale-aware display formats, with no timezone shifting."},{"id":"utils-experience-tier","label":"Tier range helper","type":"service","layer":"data","path":"app/utils/experien const LAYERS = ['entry', 'domain', 'data', 'async', 'integration', 'infra']
const LAYER_META = {
  entry: { title: 'Entry — routes & shell', color: 'var(--entry)' },
  domain: { title: 'Domain — components with behaviour', color: 'var(--domain)' },
  data: { title: 'Data — composables, types, helpers', color: 'var(--data)' },
  async: { title: 'Async — realtime', color: 'var(--async)' },
  integration: { title: 'Integration — external systems', color: 'var(--integration)' },
  infra: { title: 'Infra — config, storage, deploy', color: 'var(--infra)' },
}

const NODE_W = 178, NODE_H = 54, GAP_X = 22, GAP_Y = 22
const BAND_HEAD = 24, BAND_GAP = 46, COLS = 7, PAD = 30

const byId = new Map(GRAPH.nodes.map(n => [n.id, n]))
const degree = new Map(GRAPH.nodes.map(n => [n.id, 0]))
for (const e of GRAPH.edges) {
  degree.set(e.from, (degree.get(e.from) ?? 0) + 1)
  degree.set(e.to, (degree.get(e.to) ?? 0) + 1)
}

/* ── Layout ──────────────────────────────────────────────────────────────── */
const pos = new Map()
const bands = []
let cursorY = PAD, maxW = 0

for (const layer of LAYERS) {
  const nodes = GRAPH.nodes.filter(n => n.layer === layer)
  if (!nodes.length) { continue }
  const rows = Math.ceil(nodes.length / COLS)
  const cols = Math.ceil(nodes.length / rows)
  const w = cols * NODE_W + (cols - 1) * GAP_X
  maxW = Math.max(maxW, w)
  bands.push({ layer, nodes, rows, cols, w, y: cursorY })
  cursorY += BAND_HEAD + rows * NODE_H + (rows - 1) * GAP_Y + BAND_GAP
}
const TOTAL_W = maxW + PAD * 2
const TOTAL_H = cursorY - BAND_GAP + PAD

for (const band of bands) {
  const x0 = (TOTAL_W - band.w) / 2
  band.x = x0
  band.nodes.forEach((n, i) => {
    const r = Math.floor(i / band.cols), c = i % band.cols
    pos.set(n.id, {
      x: x0 + c * (NODE_W + GAP_X),
      y: band.y + BAND_HEAD + r * (NODE_H + GAP_Y),
    })
  })
}

/* ── Render ──────────────────────────────────────────────────────────────── */
const canvas = document.getElementById('canvas')
const svg = document.getElementById('edges')
const overlay = document.getElementById('overlay')
const nodesLayer = document.getElementById('nodes')
const diagram = document.getElementById('diagram')
const tooltip = document.getElementById('tooltip')

for (const el of [canvas, svg, overlay, nodesLayer]) {
  el.style.width = TOTAL_W + 'px'
  el.style.height = TOTAL_H + 'px'
}
svg.setAttribute('viewBox', `0 0 ${TOTAL_W} ${TOTAL_H}`)
overlay.setAttribute('viewBox', `0 0 ${TOTAL_W} ${TOTAL_H}`)

svg.innerHTML = `<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#3f556c"></path>
  </marker>
  <marker id="ahf" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#fde047"></path>
  </marker>
</defs>`

document.getElementById('counts').textContent =
  `${GRAPH.nodes.length} nodes · ${GRAPH.edges.length} edges · ${GRAPH.flows.length} flows`
document.getElementById('legend').innerHTML = LAYERS
  .map(l => `<span><i style="background:${LAYER_META[l].color}"></i>${LAYER_META[l].title}</span>`).join('')

/* band labels + rules */
for (const band of bands) {
  const lab = document.createElement('div')
  lab.className = 'band-label'
  lab.textContent = LAYER_META[band.layer].title
  lab.style.left = band.x + 'px'
  lab.style.top = band.y + 'px'
  lab.style.color = LAYER_META[band.layer].color
  nodesLayer.appendChild(lab)

  const rule = document.createElement('div')
  rule.className = 'band-rule'
  rule.style.left = PAD + 'px'
  rule.style.top = (band.y + BAND_HEAD - 8) + 'px'
  rule.style.width = (TOTAL_W - PAD * 2) + 'px'
  nodesLayer.appendChild(rule)
}

/* nodes */
const nodeEls = new Map()
for (const n of GRAPH.nodes) {
  const p = pos.get(n.id)
  const el = document.createElement('div')
  el.className = 'node' + (degree.get(n.id) === 0 ? ' orphan' : '')
  el.style.left = p.x + 'px'
  el.style.top = p.y + 'px'
  el.style.width = NODE_W + 'px'
  el.style.height = NODE_H + 'px'
  el.style.borderLeftColor = LAYER_META[n.layer].color
  el.innerHTML = `<div class="nl"></div><div class="nt"></div>`
  el.querySelector('.nl').textContent = n.label
  el.querySelector('.nt').textContent = n.type
  el.addEventListener('pointerenter', () => showTip(n, el))
  el.addEventListener('pointerleave', hideTip)
  el.addEventListener('click', (ev) => { ev.stopPropagation(); showTip(n, el) })
  nodesLayer.appendChild(el)
  nodeEls.set(n.id, el)
}

/* edges */
const edgeEls = []
function anchor(a, b) {
  const ac = { x: a.x + NODE_W / 2, y: a.y + NODE_H / 2 }
  const bc = { x: b.x + NODE_W / 2, y: b.y + NODE_H / 2 }
  if (Math.abs(bc.y - ac.y) > NODE_H) {
    const down = bc.y > ac.y
    const y1 = down ? a.y + NODE_H : a.y
    const y2 = down ? b.y : b.y + NODE_H
    const dy = Math.max(28, Math.abs(y2 - y1) * 0.45)
    return `M${ac.x},${y1} C${ac.x},${down ? y1 + dy : y1 - dy} ${bc.x},${down ? y2 - dy : y2 + dy} ${bc.x},${y2}`
  }
  const right = bc.x > ac.x
  const x1 = right ? a.x + NODE_W : a.x
  const x2 = right ? b.x : b.x + NODE_W
  const dx = Math.max(24, Math.abs(x2 - x1) * 0.5)
  const lift = 14
  return `M${x1},${ac.y} C${x1 + (right ? dx : -dx)},${ac.y - lift} ${x2 + (right ? -dx : dx)},${bc.y - lift} ${x2},${bc.y}`
}
for (const e of GRAPH.edges) {
  const a = pos.get(e.from), b = pos.get(e.to)
  const d = anchor(a, b)
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
  path.setAttribute('d', d)
  path.setAttribute('class', 'edge')
  path.setAttribute('marker-end', 'url(#ah)')
  svg.appendChild(path)
  const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path')
  hit.setAttribute('d', d)
  hit.setAttribute('class', 'edge-hit')
  hit.addEventListener('pointerenter', ev => showEdgeTip(e, ev))
  hit.addEventListener('pointerleave', hideTip)
  svg.appendChild(hit)
  edgeEls.push({ e, path })
}

/* ── Tooltip ─────────────────────────────────────────────────────────────── */
function placeTip(cx, cy) {
  tooltip.classList.add('show')
  const r = tooltip.getBoundingClientRect()
  let x = cx + 14, y = cy + 14
  if (x + r.width > window.innerWidth - 8) { x = Math.max(8, cx - r.width - 14) }
  if (y + r.height > window.innerHeight - 8) { y = Math.max(8, cy - r.height - 14) }
  tooltip.style.left = x + 'px'
  tooltip.style.top = y + 'px'
}
function showTip(n, el) {
  tooltip.innerHTML = `<div class="tl"></div><div class="tm"></div><div class="td"></div>`
  tooltip.querySelector('.tl').textContent = n.label
  tooltip.querySelector('.tm').textContent = `${n.type} · ${n.layer} · ${n.path}`
  tooltip.querySelector('.td').textContent = n.description
  const r = el.getBoundingClientRect()
  placeTip(r.left + r.width / 2, r.top + r.height / 2)
}
function showEdgeTip(e, ev) {
  tooltip.innerHTML = `<div class="tl"></div><div class="td"></div>`
  tooltip.querySelector('.tl').textContent = `${byId.get(e.from).label} → ${byId.get(e.to).label}`
  tooltip.querySelector('.td').textContent = e.type + (e.label ? ` · ${e.label}` : '')
  placeTip(ev.clientX, ev.clientY)
}
function hideTip() { tooltip.classList.remove('show') }

/* ── Zoom & pan ──────────────────────────────────────────────────────────── */
let scale = 1, tx = 0, ty = 0
function apply() { canvas.style.transform = `translate(${tx}px,${ty}px) scale(${scale})` }
function fitTo(box) {
  const r = diagram.getBoundingClientRect()
  if (!r.width || !r.height) { return }
  const m = 24
  scale = Math.min((r.width - m * 2) / box.w, (r.height - m * 2) / box.h)
  scale = Math.max(0.12, Math.min(scale, 1.35))
  tx = (r.width - box.w * scale) / 2 - box.x * scale
  ty = (r.height - box.h * scale) / 2 - box.y * scale
  apply()
}
const fullBox = { x: 0, y: 0, w: TOTAL_W, h: TOTAL_H }
function boxOf(ids) {
  const ps = ids.map(id => pos.get(id)).filter(Boolean)
  if (!ps.length) { return fullBox }
  const x1 = Math.min(...ps.map(p => p.x)) - 40
  const y1 = Math.min(...ps.map(p => p.y)) - 40
  const x2 = Math.max(...ps.map(p => p.x)) + NODE_W + 40
  const y2 = Math.max(...ps.map(p => p.y)) + NODE_H + 40
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 }
}
function fit() { fitTo(activeFlow ? boxOf(activeFlow.steps) : fullBox) }

diagram.addEventListener('wheel', (ev) => {
  ev.preventDefault()
  const r = diagram.getBoundingClientRect()
  const mx = ev.clientX - r.left, my = ev.clientY - r.top
  const next = Math.max(0.1, Math.min(2.6, scale * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)))
  tx = mx - (mx - tx) * (next / scale)
  ty = my - (my - ty) * (next / scale)
  scale = next
  apply()
}, { passive: false })

let dragging = false, lastX = 0, lastY = 0
diagram.addEventListener('pointerdown', (ev) => {
  dragging = true; lastX = ev.clientX; lastY = ev.clientY
  diagram.classList.add('dragging')
  diagram.setPointerCapture(ev.pointerId)
})
diagram.addEventListener('pointermove', (ev) => {
  if (!dragging) { return }
  tx += ev.clientX - lastX; ty += ev.clientY - lastY
  lastX = ev.clientX; lastY = ev.clientY
  apply()
})
for (const t of ['pointerup', 'pointercancel']) {
  diagram.addEventListener(t, () => { dragging = false; diagram.classList.remove('dragging') })
}
function zoomBy(f) {
  const r = diagram.getBoundingClientRect()
  const mx = r.width / 2, my = r.height / 2
  const next = Math.max(0.1, Math.min(2.6, scale * f))
  tx = mx - (mx - tx) * (next / scale)
  ty = my - (my - ty) * (next / scale)
  scale = next
  apply()
}
document.getElementById('btn-fit').addEventListener('click', fit)
document.getElementById('btn-zin').addEventListener('click', () => zoomBy(1.25))
document.getElementById('btn-zout').addEventListener('click', () => zoomBy(1 / 1.25))
window.addEventListener('resize', fit)
requestAnimationFrame(() => requestAnimationFrame(fit))
window.addEventListener('load', fit)

/* ── Flows ───────────────────────────────────────────────────────────────── */
const flowsBox = document.getElementById('flows')
let activeFlow = null

const clearBtn = document.createElement('button')
clearBtn.className = 'clear'
clearBtn.textContent = 'Show the whole graph'
clearBtn.addEventListener('click', () => selectFlow(null))
flowsBox.appendChild(clearBtn)

const flowCards = new Map()
for (const f of GRAPH.flows) {
  const card = document.createElement('div')
  card.className = 'flow'
  card.innerHTML = `<div class="fn"></div><div class="fd"></div><ul class="steps" hidden></ul>`
  card.querySelector('.fn').textContent = f.name
  card.querySelector('.fd').textContent = f.description
  const ul = card.querySelector('.steps')
  f.steps.forEach((id, i) => {
    const n = byId.get(id)
    const li = document.createElement('li')
    li.innerHTML = `<span class="n"></span><span><span class="sl"></span><br><span class="sp"></span></span>`
    li.querySelector('.n').textContent = i + 1
    li.querySelector('.sl').textContent = n.label
    li.querySelector('.sp').textContent = n.path
    li.addEventListener('click', (ev) => { ev.stopPropagation(); centreOn(id) })
    ul.appendChild(li)
  })
  card.addEventListener('click', () => selectFlow(activeFlow === f ? null : f))
  flowsBox.appendChild(card)
  flowCards.set(f.id, card)
}

function centreOn(id) {
  const p = pos.get(id)
  const r = diagram.getBoundingClientRect()
  tx = r.width / 2 - (p.x + NODE_W / 2) * scale
  ty = r.height / 2 - (p.y + NODE_H / 2) * scale
  apply()
  const el = nodeEls.get(id)
  el.classList.add('focus')
  setTimeout(() => el.classList.remove('focus'), 900)
}

function selectFlow(f) {
  activeFlow = f
  overlay.innerHTML = ''
  for (const b of overlay.parentNode.querySelectorAll('.badge')) { b.remove() }
  for (const [id, card] of flowCards) {
    const on = f && f.id === id
    card.classList.toggle('active', !!on)
    card.querySelector('.steps').hidden = !on
  }
  if (!f) {
    for (const el of nodeEls.values()) { el.classList.remove('dim', 'on') }
    for (const { path } of edgeEls) { path.classList.remove('dim', 'on') }
    fit()
    return
  }
  const onPath = new Set(f.steps)
  for (const [id, el] of nodeEls) {
    el.classList.toggle('on', onPath.has(id))
    el.classList.toggle('dim', !onPath.has(id))
  }
  const pairs = new Set()
  for (let i = 0; i < f.steps.length - 1; i++) { pairs.add(f.steps[i] + '>' + f.steps[i + 1]) }
  for (const { e, path } of edgeEls) {
    const hot = pairs.has(e.from + '>' + e.to)
    path.classList.toggle('on', hot)
    path.classList.toggle('dim', !hot)
    path.setAttribute('marker-end', hot ? 'url(#ahf)' : 'url(#ah)')
  }
  /* ordered overlay through every step, direct edge or not */
  const pts = f.steps.map(id => {
    const p = pos.get(id)
    return { x: p.x + NODE_W / 2, y: p.y + NODE_H / 2 }
  })
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1]
    const seg = document.createElementNS('http://www.w3.org/2000/svg', 'path')
    const mx = (a.x + b.x) / 2
    seg.setAttribute('d', `M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`)
    seg.setAttribute('class', 'flow-path')
    seg.setAttribute('marker-end', 'url(#ahf)')
    overlay.appendChild(seg)
  }
  f.steps.forEach((id, i) => {
    const p = pos.get(id)
    const badge = document.createElement('div')
    badge.className = 'badge'
    badge.textContent = i + 1
    badge.style.left = (p.x - 8) + 'px'
    badge.style.top = (p.y - 8) + 'px'
    canvas.appendChild(badge)
  })
  fitTo(boxOf(f.steps))
}

diagram.addEventListener('click', (ev) => { if (ev.target === diagram || ev.target === canvas) { hideTip() } })
</script>
</body>
