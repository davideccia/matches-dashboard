name: GHCR publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ghcr.io accetta solo path minuscoli, la variabile può non esserlo.
      # VERSION: titolo della release (fallback: tag, poi short SHA per gli
      # avvii manuali senza release), normalizzato ai caratteri ammessi in un
      # tag Docker ([A-Za-z0-9_.-], max 128, non può iniziare con . o -).
      - name: Resolve image and tag
        env:
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "IMAGE=ghcr.io/$(echo "${{ vars.GHCR_USERNAME }}" | tr '[:upper:]' '[:lower:]')/matches-dashboard" >> "$GITHUB_ENV"
          RAW="${RELEASE_TITLE:-${RELEASE_TAG:-$(echo "$GITHUB_SHA" | cut -c1-7)}}"
          VERSION=$(printf '%s' "$RAW" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[.-]*//' | cut -c1-128)
          echo "VERSION=${VERSION:-$(echo "$GITHUB_SHA" | cut -c1-7)}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Il Dockerfile usa `# syntax=` e una cache mount, quindi serve BuildKit.
      # Il context è la ROOT del repo. I build-arg vuoti degradano sui default
      # del Dockerfile.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: |
            NUXT_BASE_URL=${{ vars.NUXT_BASE_URL }}
            NUXT_PUBLIC_REVERB_HOST=${{ vars.NUXT_PUBLIC_REVERB_HOST }}
            NUXT_PUBLIC_REVERB_PORT=${{ vars.NUXT_PUBLIC_REVERB_PORT }}
            NUXT_PUBLIC_REVERB_SCHEME=${{ vars.NUXT_PUBLIC_REVERB_SCHEME }}
            NUXT_PUBLIC_REVERB_APP_KEY=${{ secrets.NUXT_PUBLIC_REVERB_APP_KEY }}
            NUXT_PUBLIC_ENV_SWITCHER_PASSWORD=${{ secrets.NUXT_PUBLIC_ENV_SWITCHER_PASSWORD }}
