version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - corepack enable
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm generate
  artifacts:
    baseDirectory: .output/public
    files:
      - '**/*'
  cache:
    # .nuxt is deliberately NOT cached: a stale build cache keeps the old
    # NUXT_PUBLIC_* values baked in when only an env var changes.
    paths:
      - node_modules/**/*
